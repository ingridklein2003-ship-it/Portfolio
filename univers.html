<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Univers – Mit uperfekte univers</title>

  <!-- Fonts (samme som resten af sitet) -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Din hoved-css -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Side-specifik CSS (kun til univers) -->
  <style>
    html { scroll-behavior: smooth; }

    body.universe-locked { overflow: hidden; }

    .univers-main {
      padding: 5rem 1.5rem 4rem;
      background: #fff;
      min-height: 100vh;
    }

    .univers-wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    .univers-hero {
      margin: 0 auto 2.5rem;
      max-width: 920px;
      border: 1px solid #0A0A0A;
      padding: 2.5rem;
      background: #fff;
    }

    .univers-eyebrow {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #0000FF;
      margin: 0 0 0.6rem;
    }

    .univers-title {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 0.7rem;
      line-height: 1;
    }

    .univers-lead {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #444;
      max-width: 58ch;
    }

    .book-shelf {
      display: grid;
      gap: 1.25rem;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .shelf-book {
      border: 1px solid #0A0A0A;
      border-radius: 0;
      padding: 0 0 1.25rem;
      background: #fff;
      box-shadow: none;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      min-height: 260px;
      overflow: hidden;
      transition: background 0.15s ease;
      font-family: inherit;
    }

    .shelf-book:hover { background: #F4F4F4; }

    .shelf-book .shelf-book__title,
    .shelf-book .shelf-book__meta,
    .shelf-book .shelf-book__cta {
      padding-left: 1.25rem;
      padding-right: 1.25rem;
    }

    .shelf-book .shelf-book__title { padding-top: 1.25rem; }

    .shelf-book::before {
      content: "";
      width: 100%;
      height: 180px;
      border-radius: 0;
      background: #F4F4F4;
      border-bottom: 1px solid #0A0A0A;
      flex-shrink: 0;
    }

    .shelf-book[data-book-id="wireframes"]::before {
      background: url("img/bog-prototype-01.webp") center/cover no-repeat;
    }

    .shelf-book[data-book-id="tattoo"]::before {
      background: url("img/bog-tegning-01.webp") center/cover no-repeat;
    }

    .shelf-book[data-book-id="graphic"]::before {
      background: url("img/Figur_håndbold.webp") center/cover no-repeat;
    }

    .shelf-book__tag {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #0000FF;
    }

    .shelf-book__title {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.4rem;
    }

    .shelf-book__meta {
      margin: 0;
      font-size: 0.88rem;
      color: #777;
      line-height: 1.5;
    }

    /* inner text padding */
    .shelf-book > :not(.shelf-book::before) {
      padding: 1.25rem;
    }
    /* workaround: wrap text content */
    .shelf-book__body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .shelf-book__cta {
      margin-top: auto;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #0000FF;
      display: inline-flex;
      gap: 0.35rem;
      align-items: center;
      padding-top: 0.75rem;
    }

    /* OVERLAY */
    .universe-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.85);
      display: grid;
      place-items: center;
      padding: 1rem;
      z-index: 30;
    }

    .universe-book {
      width: min(1200px, 94vw);
      height: min(680px, 80vh);
      background: #fff;
      border: 1px solid #0A0A0A;
      border-radius: 0;
      box-shadow: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .book-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #0A0A0A;
    }

    .book-header h2 {
      margin: 0;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .book-header p {
      margin: 0.25rem 0 0;
      font-size: 0.85rem;
      color: #777;
    }

    .book-close {
      border: 1px solid #0A0A0A;
      background: transparent;
      padding: 0.45rem 1rem;
      border-radius: 0;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: inherit;
      transition: background 0.12s, color 0.12s;
    }

    .book-close:hover { background: #0A0A0A; color: #fff; }

    .book-spread {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
      padding: 0;
      position: relative;
      min-height: 0;
      background: #F4F4F4;
    }

    .book-spread::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: 100%;
      background: #E0E0E0;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .book-page {
      border-radius: 0;
      background: #fff;
      border: none;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .book-page figure {
      margin: 0;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .book-page img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 0;
    }

    .book-caption {
      margin-top: 0.5rem;
      border-top: 1px solid #E0E0E0;
      padding-top: 0.35rem;
      font-size: 0.82rem;
      color: #444;
      min-height: 1.6rem;
    }

    .book-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      border-top: 1px solid #0A0A0A;
    }

    .nav-buttons { display: flex; gap: 0.5rem; }

    .nav-btn {
      border: 1px solid #0A0A0A;
      background: transparent;
      padding: 0.5rem 1rem;
      border-radius: 0;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: background 0.12s, color 0.12s;
    }

    .nav-btn:hover { background: #0A0A0A; color: #fff; }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .page-indicator {
      font-size: 0.85rem;
      color: #777;
    }

    @media (max-width: 760px) {
      .book-spread { grid-template-columns: 1fr; }
      .book-spread::before { display: none; }
      .universe-book { height: min(700px, 85vh); }
    }
  </style>
</head>

  <script type="module">
    import React, { useEffect, useMemo, useState } from "https://esm.sh/react@18.3.1";
    import { hydrateRoot } from "https://esm.sh/react-dom@18.3.1/client";
    import { AnimatePresence, motion } from "https://esm.sh/motion@11.11.13/react";

    const books = window.__universeBooks || [];

    const formatIndicator = (index, total) => {
      const left = index + 1;
      const right = Math.min(index + 2, total);
      return `Side ${left}–${right} / ${total}`;
    };

    const Page = ({ page, side, direction, pageKey }) => {
      const rotation = side === "left" ? -12 : 12;
      const offset = direction >= 0 ? rotation : -rotation;

      if (!page) {
        return (
          <motion.div
            className="book-page"
            key={`empty-${pageKey}`}
            initial={{ opacity: 0, rotateY: offset }}
            animate={{ opacity: 1, rotateY: 0 }}
            exit={{ opacity: 0, rotateY: -offset }}
            transition={{ duration: 0.35, ease: "easeOut" }}
          >
            <figure aria-hidden="true"></figure>
          </motion.div>
        );
      }

      const hasCaption = Boolean(page.title || page.text);

      return (
        <motion.div
          className="book-page"
          key={`${page.img}-${pageKey}`}
          initial={{ opacity: 0, rotateY: offset }}
          animate={{ opacity: 1, rotateY: 0 }}
          exit={{ opacity: 0, rotateY: -offset }}
          transition={{ duration: 0.35, ease: "easeOut" }}
          style={{ transformStyle: "preserve-3d" }}
        >
          <figure>
            <img src={page.img} alt={page.title || "Skitse side"} loading="lazy" />
          </figure>
          {hasCaption && (
            <div className="book-caption">
              {page.title && <strong>{page.title}</strong>}
              {page.text && ` — ${page.text}`}
            </div>
          )}
        </motion.div>
      );
    };

    const UniverseApp = () => {
      const [activeBookId, setActiveBookId] = useState(null);
      const [pageIndex, setPageIndex] = useState(0);
      const [direction, setDirection] = useState(1);

      const activeBook = useMemo(
        () => books.find((book) => book.id === activeBookId) || null,
        [activeBookId]
      );

      useEffect(() => {
        document.body.classList.toggle("universe-locked", Boolean(activeBook));
        if (activeBook) {
          setPageIndex(0);
        }
        window.__universeHydrated = true;
      }, [activeBook]);

      const totalPages = activeBook?.pages.length ?? 0;
      const leftPage = activeBook?.pages[pageIndex] ?? null;
      const rightPage = activeBook?.pages[pageIndex + 1] ?? null;

      const canGoPrev = pageIndex > 0;
      const canGoNext = pageIndex + 2 < totalPages;

      const goPrev = () => {
        if (!canGoPrev) return;
        setDirection(-1);
        setPageIndex((prev) => prev - 2);
      };

      const goNext = () => {
        if (!canGoNext) return;
        setDirection(1);
        setPageIndex((prev) => prev + 2);
      };

      return (
        <>
          <section className="univers-hero">
            <p className="univers-eyebrow">Mit uperfekte univers</p>
            <h1 className="univers-title">Tre skitsebøger, tre kreative spor</h1>
            <p className="univers-lead">
              Vælg en bog og bladre igennem mit arbejde som åbne skitsebøger — to sider ad gangen, uden
              forstyrrelser.
            </p>
          </section>

          <section className="book-shelf" aria-label="Boghylde med kreative kategorier">
            {books.map((book) => (
              <motion.button
                key={book.id}
                type="button"
                whileHover={{ y: -6 }}
                whileTap={{ scale: 0.98 }}
                className="shelf-book"
                data-book-id={book.id}
                onClick={() => setActiveBookId(book.id)}
              >
                <h2 className="shelf-book__title">{book.title}</h2>
                <p className="shelf-book__meta">{book.pages.length} sider • {book.description}</p>
                <span className="shelf-book__cta">Åbn bog →</span>
              </motion.button>
            ))}
          </section>

          <AnimatePresence>
            {activeBook && (
              <motion.section
                className="universe-overlay"
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                exit={{ opacity: 0 }}
              >
                <motion.div
                  className="universe-book"
                  initial={{ opacity: 0, y: 20, scale: 0.98 }}
                  animate={{ opacity: 1, y: 0, scale: 1 }}
                  exit={{ opacity: 0, y: 10, scale: 0.98 }}
                  transition={{ type: "spring", stiffness: 140, damping: 18 }}
                >
                  <header className="book-header">
                    <div>
                      <h2>{activeBook.title}</h2>
                      <p>{activeBook.description}</p>
                    </div>
                    <button className="book-close" type="button" onClick={() => setActiveBookId(null)}>
                      Luk
                    </button>
                  </header>

                  <div className="book-spread">
                    <AnimatePresence mode="wait">
                      <Page
                        page={leftPage}
                        side="left"
                        direction={direction}
                        pageKey={`${pageIndex}-left`}
                      />
                    </AnimatePresence>
                    <AnimatePresence mode="wait">
                      <Page
                        page={rightPage}
                        side="right"
                        direction={direction}
                        pageKey={`${pageIndex}-right`}
                      />
                    </AnimatePresence>
                  </div>

                  <div className="book-nav">
                    <div className="nav-buttons">
                      <button className="nav-btn" type="button" onClick={goPrev} disabled={!canGoPrev}>
                        Forrige
                      </button>
                      <button className="nav-btn" type="button" onClick={goNext} disabled={!canGoNext}>
                        Næste
                      </button>
                    </div>
                    <span className="page-indicator">{formatIndicator(pageIndex, totalPages)}</span>
                  </div>
                </motion.div>
              </motion.section>
            )}
          </AnimatePresence>
        </>
      );
    };

    hydrateRoot(document.getElementById("universe-app"), <UniverseApp />);
  </script>

  <script>
    (() => {
      const books = window.__universeBooks || [];
      if (!books.length) return;

      const buildOverlay = () => {
        const overlay = document.createElement("section");
        overlay.className = "universe-overlay";
        overlay.setAttribute("aria-hidden", "true");
        overlay.innerHTML = `
          <div class="universe-book">
            <header class="book-header">
              <div>
                <h2></h2>
                <p></p>
              </div>
              <button class="book-close" type="button">Luk</button>
            </header>
            <div class="book-spread">
              <div class="book-page"><figure><img alt=""></figure><div class="book-caption"></div></div>
              <div class="book-page"><figure><img alt=""></figure><div class="book-caption"></div></div>
            </div>
            <div class="book-nav">
              <div class="nav-buttons">
                <button class="nav-btn" type="button" data-action="prev">Forrige</button>
                <button class="nav-btn" type="button" data-action="next">Næste</button>
              </div>
              <span class="page-indicator"></span>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);
        return overlay;
      };

      const formatIndicator = (index, total) => {
        const left = index + 1;
        const right = Math.min(index + 2, total);
        return `Side ${left}–${right} / ${total}`;
      };

      const updatePage = (pageEl, page) => {
        const img = pageEl.querySelector("img");
        const caption = pageEl.querySelector(".book-caption");
        if (!page) {
          img.removeAttribute("src");
          img.setAttribute("alt", "");
          caption.textContent = "";
          return;
        }
        img.src = page.img;
        img.alt = page.title || "Skitse side";
        if (page.title || page.text) {
          caption.textContent = page.title ? `${page.title}${page.text ? " — " + page.text : ""}` : page.text;
        } else {
          caption.textContent = "";
        }
      };

      const initFallback = () => {
        if (window.__universeHydrated) return;
        const overlay = buildOverlay();
        const bookEl = overlay.querySelector(".universe-book");
        const [leftPageEl, rightPageEl] = overlay.querySelectorAll(".book-page");
        const titleEl = overlay.querySelector("h2");
        const descEl = overlay.querySelector("p");
        const indicatorEl = overlay.querySelector(".page-indicator");
        const prevBtn = overlay.querySelector("[data-action=\"prev\"]");
        const nextBtn = overlay.querySelector("[data-action=\"next\"]");
        const closeBtn = overlay.querySelector(".book-close");
        let activeBook = null;
        let pageIndex = 0;

        const render = () => {
          if (!activeBook) return;
          updatePage(leftPageEl, activeBook.pages[pageIndex]);
          updatePage(rightPageEl, activeBook.pages[pageIndex + 1]);
          indicatorEl.textContent = formatIndicator(pageIndex, activeBook.pages.length);
          prevBtn.disabled = pageIndex <= 0;
          nextBtn.disabled = pageIndex + 2 >= activeBook.pages.length;
        };

        const openBook = (bookId) => {
          activeBook = books.find((book) => book.id === bookId);
          if (!activeBook) return;
          pageIndex = 0;
          titleEl.textContent = activeBook.title;
          descEl.textContent = activeBook.description;
          bookEl.className = "universe-book";
          overlay.setAttribute("aria-hidden", "false");
          overlay.style.display = "grid";
          document.body.classList.add("universe-locked");
          render();
        };

        const closeBook = () => {
          overlay.setAttribute("aria-hidden", "true");
          overlay.style.display = "none";
          document.body.classList.remove("universe-locked");
          activeBook = null;
        };

        prevBtn.addEventListener("click", () => {
          if (!activeBook || pageIndex <= 0) return;
          pageIndex -= 2;
          render();
        });

        nextBtn.addEventListener("click", () => {
          if (!activeBook || pageIndex + 2 >= activeBook.pages.length) return;
          pageIndex += 2;
          render();
        });

        closeBtn.addEventListener("click", closeBook);
        overlay.addEventListener("click", (event) => {
          if (event.target === overlay) closeBook();
        });

        document.querySelectorAll("[data-book-id]").forEach((button) => {
          button.addEventListener("click", () => openBook(button.dataset.bookId));
        });

        overlay.style.display = "none";
      };

      window.addEventListener("load", () => {
        setTimeout(initFallback, 1200);
      });
    })();
  </script>
</body>
</html>
