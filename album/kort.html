<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR-kort</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Printbare QR-kort til et album. Brug: /album/kort.html?a=<slug>  Vælg format, og tryk Print (Gem som PDF). */
  :root{--dark:#161514;--paper:#EFE8DD;--cream:#F1EADF;--muted:#6F6A63;--line:#DDD4C6;--gold:#B9AE9C;
    --serif:"Instrument Serif",Georgia,serif;--sans:"Hanken Grotesk",system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:#D9D4CC;font-family:var(--sans);color:var(--dark)}
  .bar{position:sticky;top:0;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;
    padding:12px;background:#fff;border-bottom:1px solid var(--line);font-size:15px;z-index:2}
  .bar button,.bar select{font:inherit;height:40px;border-radius:999px;border:1px solid var(--dark);background:#fff;padding:0 16px}
  .bar button{background:var(--dark);color:#fff;cursor:pointer}
  .sheets{display:grid;gap:24px;justify-items:center;padding:24px}
  .sheet{background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.15)}
  .a6 .sheet{width:105mm;height:148mm}
  .a4 .sheet{width:210mm;height:297mm;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .card{width:105mm;height:148mm;overflow:hidden;position:relative}
  .a4 .card{outline:.2mm dashed #ccc;outline-offset:-.1mm}

  .front{background:var(--dark);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:10mm 8mm}
  .front h1{font-family:var(--serif);font-weight:400;font-size:13mm;line-height:1;margin:0 0 4mm}
  .front h1 .amp{color:var(--gold);font-style:italic;font-size:.75em}
  .front .sub{font-size:3.6mm;margin:0 0 6mm}
  .qr{background:var(--cream);border-radius:3mm;padding:3.5mm;width:43mm;height:43mm}
  .qr svg{width:100%;height:100%;display:block}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:2mm;margin:6mm 0 0;width:100%}
  .steps span{display:grid;place-items:center;width:6mm;height:6mm;border:.3mm solid var(--gold);border-radius:50%;
    margin:0 auto 1.5mm;font-size:2.8mm}
  .steps p{margin:0;font-size:2.9mm}
  .front .url{margin:6mm 0 0;color:var(--gold);font-size:3mm}

  .back{background:#fff;padding:10mm 9mm 8mm;display:flex;flex-direction:column}
  .back h2{font-family:var(--serif);font-weight:400;font-size:10mm;text-align:center;margin:0}
  .back .lyst{font-family:var(--serif);font-style:italic;color:var(--muted);text-align:center;font-size:4.2mm;margin:0 0 5mm}
  .back ol{list-style:none;margin:0;padding:0;border-top:.3mm solid var(--line)}
  .back li{display:flex;gap:3mm;align-items:center;border-bottom:.3mm solid var(--line);padding:1.9mm 0;font-size:3.1mm;line-height:1.25}
  .back li i{flex:none;width:3.6mm;height:3.6mm;border:.3mm solid var(--dark);border-radius:.8mm}
  .back .tip{text-align:center;color:var(--muted);font-size:2.8mm;margin:3mm 0 0}
  .back .foot{margin-top:auto;display:flex;gap:4mm;align-items:center;justify-content:center}
  .back .foot .mini{width:16mm;height:16mm}
  .back .foot p{margin:0;font-size:3mm;color:var(--muted)}
  .back .foot b{display:block;color:var(--dark)}
  .msg{text-align:center;padding:40px}

  @media print{
    body{background:#fff}
    .bar{display:none}
    .sheets{padding:0;gap:0}
    .sheet{box-shadow:none;break-after:page}
    .a6 .card{break-after:page}
    .a4 .card{outline:none}
  }
</style>
<style id="pageSize">@page{size:105mm 148mm;margin:0}</style>
</head>
<body>
<div class="bar">
  <label>Format
    <select id="format">
      <option value="a6">A6 – ét kort pr. side (for- og bagside)</option>
      <option value="a4">4 pr. A4 – forsider, så bagsider</option>
    </select>
  </label>
  <button type="button" onclick="print()">Print / gem som PDF</button>
</div>
<div class="sheets a6" id="sheets"><p class="msg">Henter albummet …</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const API = "https://nnpswsaydjlabwtnewoc.supabase.co/functions/v1/album";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ucHN3c2F5ZGpsYWJ3dG5ld29jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDA4OTAsImV4cCI6MjEwODE3Njg5MH0.SlxxPEqoo9VfzBkgYgjVkuVasJouSsZcSal_37FQFyI";
const SLUG = (new URLSearchParams(location.search).get("a") || "").toLowerCase();
const URL_ = `https://www.kleindesign.dk/album/${SLUG}`;
const SHOWN = `kleindesign.dk/album/${SLUG}`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function qrSvg(text){
  const q = qrcode(0, "M"); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
}

function front(c){
  const names = (c.names || []).map(esc).join(' <span class="amp">&amp;</span> ');
  return `<section class="card front">
    <h1>${names}</h1>
    <p class="sub">${esc(c.cardText || "Del dine billeder og videoer fra dagen")}</p>
    <div class="qr">${qrSvg(URL_)}</div>
    <div class="steps"><div><span>1</span><p>Åbn kameraet</p></div><div><span>2</span><p>Peg på koden</p></div><div><span>3</span><p>Tryk på linket</p></div></div>
    <p class="url">${esc(SHOWN)}</p>
  </section>`;
}
function back(c){
  const tasks = (c.tasks || []).map((t) => `<li><i></i>${esc(t)}</li>`).join("");
  return `<section class="card back">
    <h2>Fotojagt</h2><p class="lyst">Hvis du har lyst</p>
    <ol>${tasks}</ol>
    <p class="tip">Tip: Brug blitz – så bliver de bedste.</p>
    <div class="foot"><div class="mini">${qrSvg(URL_)}</div><p>Del dem på<b>${esc(SHOWN)}</b></p></div>
  </section>`;
}

let C = null;
function render(){
  const fmt = document.getElementById("format").value;
  const box = document.getElementById("sheets");
  box.className = `sheets ${fmt}`;
  document.getElementById("pageSize").textContent = `@page{size:${fmt === "a6" ? "105mm 148mm" : "210mm 297mm"};margin:0}`;
  const hasBack = (C.tasks || []).length > 0;
  if (fmt === "a6") {
    box.innerHTML = front(C) + (hasBack ? back(C) : "");
  } else {
    box.innerHTML = `<div class="sheet">${front(C).repeat(4)}</div>` + (hasBack ? `<div class="sheet">${back(C).repeat(4)}</div>` : "");
  }
}

(async () => {
  const box = document.getElementById("sheets");
  if (!SLUG) { box.innerHTML = `<p class="msg">Tilføj albummets navn i adressen: kort.html?a=anna-og-jonas</p>`; return; }
  try {
    const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", apikey: KEY }, body: JSON.stringify({ action:"config", album: SLUG }) });
    if (!r.ok) throw new Error();
    C = (await r.json()).config;
  } catch { box.innerHTML = `<p class="msg">Albummet "${esc(SLUG)}" findes ikke.</p>`; return; }
  document.title = `QR-kort – ${(C.names || []).join(" & ")}`;
  render();
  document.getElementById("format").addEventListener("change", render);
})();
</script>
</body>
</html>
